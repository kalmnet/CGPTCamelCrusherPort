name: Publish finalized tested plugins
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact user-tested build
        run: gh run download 37824633602 --repo "$GITHUB_REPOSITORY" --name CamelCrusher-Mac-plugins --dir tested-build
      - name: Verify package and prepare release assets
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('tested-build/CamelCrusher-Mac-plugins.zip') as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert 'download/CamelCrusher.vst/Contents/MacOS/CamelCrusher' in names
              assert 'download/CamelCrusherPreservation.vst3/Contents/MacOS/CamelCrusherPreservation' in names
          PY
          mkdir -p release
          cp tested-build/CamelCrusher-Mac-plugins.zip release/CamelCrusher-Mac-plugins-0.1.1.zip
          cp CamelCrusherPreservation-source.zip release/CamelCrusherPreservation-source.zip
          cp CamelCrusherPreservation/docs/ACCEPTANCE.md release/ACCEPTANCE.md
          cp CamelCrusherPreservation/docs/INSTALL.md release/INSTALL.md
          cd release
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish private repository release
        run: >-
          gh release create v0.1.1 release/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title 'CamelCrusher Preservation 0.1.1 — finalized tested build'
          --notes-file CamelCrusherPreservation/docs/ACCEPTANCE.md
