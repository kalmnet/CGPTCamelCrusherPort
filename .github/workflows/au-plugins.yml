name: Build and validate Audio Unit
on:
  push:
    branches: [au-original-identity, main]
    paths: ['CamelCrusherPreservation/src/Au.mm', 'CamelCrusherPreservation/tests/au_*', 'CamelCrusherPreservation/resources/AuInfo.plist.in', 'CamelCrusherPreservation/CMakeLists.txt', '.github/workflows/au-plugins.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  au:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Apple AudioUnitSDK
        run: |
          git clone https://github.com/apple/AudioUnitSDK.git "$RUNNER_TEMP/AudioUnitSDK"
          git -C "$RUNNER_TEMP/AudioUnitSDK" checkout bd98b31feff57a15989fcfab4cd86dc63382b1ac
      - name: Configure universal AU
        run: >-
          cmake -S CamelCrusherPreservation -B build-au -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCAMEL_BUILD_VST3=OFF -DCAMEL_BUILD_AU=ON -DCAMEL_AU_LEGACY_ID=ON -DAUDIOUNIT_SDK_ROOT="$RUNNER_TEMP/AudioUnitSDK"
      - name: Compile
        run: cmake --build build-au --parallel 3
      - name: Core tests
        run: ctest --test-dir build-au --output-on-failure -V
      - name: Sign, install, and validate AU
        run: |
          codesign --force --deep --sign - build-au/CamelCrusher.component
          codesign --verify --deep --strict build-au/CamelCrusher.component
          lipo -archs build-au/CamelCrusher.component/Contents/MacOS/CamelCrusher
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto build-au/CamelCrusher.component "$HOME/Library/Audio/Plug-Ins/Components/CamelCrusher.component"
          plutil -p build-au/CamelCrusher.component/Contents/Info.plist
          touch "$HOME/Library/Audio/Plug-Ins/Components"
          killall AudioComponentRegistrar || true
          sudo mkdir -p /Library/Audio/Plug-Ins/Components
          sudo ditto build-au/CamelCrusher.component /Library/Audio/Plug-Ins/Components/CamelCrusher.component
          sudo touch /Library/Audio/Plug-Ins/Components
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a
          if ! auval -v aumf CaCr CamA; then
            /usr/bin/log show --last 3m --style compact --info --predicate 'process == "AudioComponentRegistrar"' || true
            exit 1
          fi
      - name: Package
        run: |
          mkdir -p download
          ditto build-au/CamelCrusher.component download/CamelCrusher.component
          cp CamelCrusherPreservation/NOTICE.md download/
          cp CamelCrusherPreservation/docs/AU-INSTALL.md download/INSTALL.md
          cp "$RUNNER_TEMP/AudioUnitSDK/LICENSE.txt" download/AudioUnitSDK-LICENSE.txt
          ditto -c -k --sequesterRsrc --keepParent download CamelCrusher-AU-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CamelCrusher-AU-Mac
          path: CamelCrusher-AU-Mac.zip
          if-no-files-found: error
